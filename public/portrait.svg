<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="tone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d7d2"/>
      <stop offset="0.42" stop-color="#8f8d89"/>
      <stop offset="0.72" stop-color="#3a3a38"/>
      <stop offset="1" stop-color="#111110"/>
    </linearGradient>
    <radialGradient id="head" cx="50%" cy="34%" r="30%">
      <stop offset="0" stop-color="#efeeea" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#efeeea" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="600" height="800" fill="url(#tone)"/>
  <ellipse cx="300" cy="270" rx="150" ry="185" fill="url(#head)"/>
  <rect width="600" height="800" filter="url(#grain)" opacity="0.5"/>
  <text x="300" y="770" font-family="monospace" font-size="18" letter-spacing="4"
        fill="#efeeea" fill-opacity="0.35" text-anchor="middle">YOUR&#160;PORTRAIT</text>
</svg>
